name: Healthcare RAG CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write


env:
  PYTHON_VERSION: "3.11"

  AZURE_RESOURCE_GROUP: "rg-healthcare-rag-dev"

  ACR_NAME: "acrhealthcareragdevsk"
  ACR_LOGIN_SERVER: "acrhealthcareragdevsk.azurecr.io"

  CONTAINER_APP_NAME: "ca-healthcare-rag-dev"

  IMAGE_NAME: "healthcare-rag"

  # =========================================================
  # CI TEST ENVIRONMENT
  # =========================================================

  APP_ENV: "test"
  CHECKPOINT_BACKEND: "sqlite"

  AUTH_MODE: "dev"
  DEV_REVIEWER: "true"

  LANGSMITH_TRACING: "false"


jobs:

  # =========================================================
  # QUALITY GATES
  # =========================================================

  quality-gates:

    name: AI Quality Gates

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Create runtime directories
        run: |
          mkdir -p data/checkpoints
          mkdir -p data/security
          mkdir -p data/tool_runtime


      - name: Validate required AI secrets
        shell: bash

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}

          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}

          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}

        run: |

          set -e

          test -n "$AZURE_OPENAI_ENDPOINT"

          test -n "$AZURE_OPENAI_API_KEY"

          test -n "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"

          test -n "$AZURE_OPENAI_CHAT_DEPLOYMENT"

          test -n "$AZURE_OPENAI_API_VERSION"

          test -n "$AZURE_SEARCH_ENDPOINT"

          test -n "$AZURE_SEARCH_API_KEY"

          test -n "$AZURE_SEARCH_INDEX_NAME"

          echo "Required AI secrets are configured."


      - name: Run AI quality gates

        env:

          APP_ENV: "test"

          AUTH_MODE: "dev"

          DEV_REVIEWER: "true"

          CHECKPOINT_BACKEND: "sqlite"

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}

          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}

          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX_NAME: ${{ secrets.AZURE_SEARCH_INDEX_NAME }}

          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}

        run: |

          python -m scripts.run_ci_quality_gates



  # =========================================================
  # BUILD + DEPLOY
  # =========================================================

  deploy:

    name: Build and Deploy

    runs-on: ubuntu-latest

    needs:
      - quality-gates

    # IMPORTANT:
    #
    # Do NOT add:
    #
    # environment:
    #   name: development
    #
    # Our Azure federated identity credential is bound to:
    #
    # repo:...:ref:refs/heads/main
    #
    # Adding a GitHub Environment changes the OIDC subject to:
    #
    # repo:...:environment:development
    #
    # and Azure login will fail with AADSTS700213.

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # AZURE OIDC LOGIN
      # =====================================================

      - name: Azure login
        uses: azure/login@v2
        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # =====================================================
      # ACR LOGIN
      # =====================================================

      - name: Login to ACR

        run: |

          az acr login \
            --name "${ACR_NAME}"


      # =====================================================
      # BUILD IMAGE
      # =====================================================

      - name: Build Docker image

        run: |

          docker build \
            -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest" \
            .


      # =====================================================
      # PUSH IMAGE
      # =====================================================

      - name: Push Docker image

        run: |

          docker push \
            "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push \
            "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"


      # =====================================================
      # DEPLOY CONTAINER APP
      # =====================================================

      - name: Deploy Container App

        run: |

          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --set-env-vars \
              APP_ENV=production \
              AUTH_MODE=azure \
              CHECKPOINT_BACKEND=sqlite


      # =====================================================
      # GET FQDN
      # =====================================================

      - name: Get Container App FQDN

        id: containerapp

        run: |

          FQDN=$(az containerapp show \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"

          echo "Container App FQDN:"

          echo "${FQDN}"


      # =====================================================
      # HEALTH CHECK
      # =====================================================

      - name: Health check

        shell: bash

        run: |

          set -e

          FQDN="${{ steps.containerapp.outputs.fqdn }}"

          echo "Checking:"
          echo "https://${FQDN}/health"

          for i in {1..20}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "https://${FQDN}/health"
            then

              echo
              echo "Health check passed."

              exit 0

            fi

            echo
            echo "Attempt ${i}/20 failed."

            echo "Waiting 15 seconds..."

            sleep 15

          done

          echo "Health check failed."

          exit 1


      # =====================================================
      # DEPLOYMENT SUMMARY
      # =====================================================

      - name: Deployment summary

        run: |

          echo "### Healthcare RAG Deployment" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Commit:**" >> "$GITHUB_STEP_SUMMARY"

          echo "\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Image:**" >> "$GITHUB_STEP_SUMMARY"

          echo "\`${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Container App:**" >> "$GITHUB_STEP_SUMMARY"

          echo "\`${CONTAINER_APP_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**FQDN:**" >> "$GITHUB_STEP_SUMMARY"

          echo "https://${{ steps.containerapp.outputs.fqdn }}" >> "$GITHUB_STEP_SUMMARY"