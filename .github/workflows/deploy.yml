name: Healthcare RAG CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-healthcare-rag-dev
  ACR_NAME: acrhealthcareragdevsk
  ACR_LOGIN_SERVER: acrhealthcareragdevsk.azurecr.io
  IMAGE_NAME: healthcare-rag
  CONTAINER_APP_NAME: ca-healthcare-rag-dev

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI tests
        run: |
          pytest -q

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Get Container App FQDN
        id: fqdn
        run: |
          FQDN=$(az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: |
          echo "Checking https://${{ steps.fqdn.outputs.fqdn }}/health"

          for i in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "https://${{ steps.fqdn.outputs.fqdn }}/health"; then

              echo ""
              echo "Health check succeeded."
              exit 0
            fi

            echo "Attempt $i failed. Waiting 10 seconds..."
            sleep 10
          done

          echo "Health check failed."
          exit 1